<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fintual — Tu camino a la libertad financiera</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0B1E4D"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Fintual"/>
    <meta name="description" content="Tu camino a la libertad financiera. Control, aprendizaje y coach IA."/>

    <!-- PWA Icons -->
    <link rel="manifest" href="/manifest.json"/>
    <link rel="apple-touch-icon" href="/icon-192.png"/>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <style>
      /* Reset base — el safe-area se maneja por componente, NO globalmente,
         para evitar que se acumule en cascada con paddings internos. */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overscroll-behavior-y: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registrar Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registrado:', reg.scope))
            .catch(err => console.log('SW error:', err));
        });
      }
    </script>
  </body>
</html>
